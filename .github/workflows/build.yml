name: Build PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile all documents
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: |
            lecture*/lecture*.tex
            organization/organization.tex
            syllabus/syllabus.tex
          args: -pdf -f -file-line-error -interaction=nonstopmode
          continue_on_error: true

      - name: Collect PDFs
        run: |
          mkdir site
          cp *.pdf *.log site/ 2>/dev/null || true
          ls -l site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
